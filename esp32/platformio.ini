; =============================================================================
; PlatformIO — Robot Bípedo · Firmware ESP32
; Framework: ESP-IDF (C NATIVO — NO Arduino)
; =============================================================================
; Reutiliza la estructura ESP-IDF existente: el código está en la carpeta main/
; (main.c + main/CMakeLists.txt).
;
; Uso:
;   1. Abrí ESTA carpeta (esp32/) en VS Code con la extensión PlatformIO.
;   2. Conectá el ESP32 por USB.
;   3. Build (✓) y luego Upload (→). Monitor serie con el enchufe/lupa.
;
; Si tu placa NO es un ESP32 clásico (WROOM-32 / DevKit v1), cambiá "board":
;   ESP32-S3 → esp32-s3-devkitc-1   |   ESP32-C3 → esp32-c3-devkitm-1
; =============================================================================

[platformio]
src_dir = main

[env:esp32dev]
; Versión FIJADA a propósito. Sin el "@5.4.0", PlatformIO baja la última
; (7.x → ESP-IDF 6.x) y la compilación se cae antes de tocar nuestro código con:
;     Error: Couldn't find target config target-__ldgen_output_sections.ld-...
; Es un problema de la integración PlatformIO/IDF 6, no del firmware. La 5.4.0
; (ESP-IDF 4.4.5) compila limpio: RAM 2.9%, Flash 24.2%.
platform     = espressif32@5.4.0
board        = esp32dev
framework    = espidf
monitor_speed = 115200
upload_speed  = 921600
