; =============================================================================
; Robot balancin - Firmware ESP32 (ESP-IDF, C puro)
; =============================================================================
; El build_dir apunta FUERA de OneDrive: los artefactos de compilacion son
; miles de archivos y OneDrive los sincroniza sin parar si viven dentro.
; =============================================================================

[platformio]
default_envs = esp32_balance
build_dir = C:/Users/luisf/Documents/.pio-builds/esp32_balance

[env:esp32_balance]
platform = espressif32@5.4.0
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 460800

; Descomenta y ajusta si PlatformIO no detecta el puerto solo:
; upload_port = COM7
; monitor_port = COM7
